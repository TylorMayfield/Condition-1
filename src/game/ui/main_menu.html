<div id="menu-overlay">
    <div class="menu-container">
        <div class="menu-header">
            <h1 class="game-title">CONDITION-1</h1>
            <p class="game-subtitle">Tactical Operations Interface</p>
        </div>

        <div class="menu-content">
            <div class="menu-sidebar">
                <button class="menu-btn" id="btn-resume" style="display:none;">Resume</button>
                <button class="menu-btn" id="btn-new-game">Deploy</button>
                <button class="menu-btn" id="btn-settings">Settings</button>
                <button class="menu-btn" id="btn-credits">Credits</button>
                <button class="menu-btn menu-btn--danger" id="btn-quit">Exit</button>
            </div>

            <!-- Map Select -->
            <div class="menu-panel" id="panel-maps">
                <h2 class="panel-title">Select Operation</h2>

                <div class="mode-row">
                    <label for="gamemode-select" class="mode-label">Mode</label>
                    <select id="gamemode-select" class="c1-select">
                        <option value="defusal">Bomb Defusal — MR8 (5v5)</option>
                        <option value="tdm">Team Deathmatch (5v5)</option>
                        <option value="ffa">Free For All</option>
                        <option value="moba">MOBA — 3-Lane Assault</option>
                        <option value="rl-training">RL Training (AI Only)</option>
                    </select>
                </div>

                <div id="campaign-options" class="mode-card" style="display:block;">
                    <h4 class="mode-card__title">Defusal Tour</h4>
                    <div class="mode-card__grid">
                        <label>Side <select id="campaign-team" class="c1-select"><option value="TaskForce">Task Force</option><option value="OpFor">OpFor</option></select></label>
                        <label>Difficulty <select id="campaign-difficulty" class="c1-select"><option value="recruit">Recruit</option><option value="veteran">Veteran</option><option value="elite">Elite</option></select></label>
                    </div>
                    <div id="campaign-progress" class="mode-card__status"></div>
                </div>

                <div id="spectator-options" class="checkbox-row">
                    <input type="checkbox" id="checkbox-spectator">
                    <label for="checkbox-spectator">Spectator Only</label>
                </div>

                <div id="rl-training-options" class="mode-card mode-card--rl" style="display: none;">
                    <h4 class="mode-card__title">Training Parameters</h4>
                    <div class="mode-card__grid">
                        <div class="mode-card__field">
                            <label for="rl-bots-per-team">Bots Per Team</label>
                            <input type="number" id="rl-bots-per-team" class="c1-input" value="3" min="1" max="10">
                        </div>
                        <div class="mode-card__field">
                            <label for="rl-round-duration">Round Duration (s)</label>
                            <input type="number" id="rl-round-duration" class="c1-input" value="30" min="10" max="300">
                        </div>
                        <div class="mode-card__field">
                            <label for="rl-autosave-interval">Auto-save Every (episodes)</label>
                            <input type="number" id="rl-autosave-interval" class="c1-input" value="10" min="1" max="100">
                        </div>
                    </div>
                    <div class="mode-card__actions">
                        <button id="rl-load-model-btn" class="menu-btn menu-btn--primary menu-btn--compact">Load Model</button>
                        <input type="file" id="rl-model-file-input" accept=".json" style="display: none;">
                        <span id="rl-model-status" class="mode-card__status">No model loaded — training from scratch</span>
                    </div>
                </div>

                <div class="map-grid" id="map-grid-container"></div>
            </div>

            <!-- Settings -->
            <div class="menu-panel" id="panel-settings">
                <h2 class="panel-title">Settings</h2>

                <div class="settings-tabs">
                    <button class="menu-btn menu-btn--compact" onclick="showSettingsTab('video')">Video</button>
                    <button class="menu-btn menu-btn--compact" onclick="showSettingsTab('audio')">Audio</button>
                    <button class="menu-btn menu-btn--compact" onclick="showSettingsTab('controls')">Controls</button>
                </div>

                <div id="settings-video" class="settings-tab">
                    <div class="setting-group">
                        <label class="setting-label">Field of View <span id="value-fov" class="setting-value">75</span></label>
                        <input type="range" id="setting-fov" min="60" max="110" value="75">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Mouse Sensitivity <span id="value-sens" class="setting-value">1.0</span></label>
                        <input type="range" id="setting-sens" min="0.1" max="5.0" step="0.1" value="1.0">
                    </div>
                </div>

                <div id="settings-audio" class="settings-tab" style="display:none;">
                    <div class="setting-group">
                        <label class="setting-label">Master Volume</label>
                        <input type="range" id="setting-vol-master" min="0" max="1" step="0.1">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">Music Volume</label>
                        <input type="range" id="setting-vol-music" min="0" max="1" step="0.1">
                    </div>
                    <div class="setting-group">
                        <label class="setting-label">SFX Volume</label>
                        <input type="range" id="setting-vol-sfx" min="0" max="1" step="0.1">
                    </div>
                </div>

                <div id="settings-controls" class="settings-tab" style="display:none;">
                    <div class="keybind-grid" id="keybind-list"></div>
                </div>

                <div class="panel-footer">
                    <button class="menu-btn menu-btn--primary" id="btn-save-settings">Save Changes</button>
                </div>
            </div>

            <!-- Credits -->
            <div class="menu-panel" id="panel-credits">
                <h2 class="panel-title">Credits</h2>

                <h3 class="panel-subtitle">Lead Developer</h3>
                <p class="credits-name">Tylor Mayfield</p>

                <h3 class="panel-subtitle">Powered By</h3>
                <ul class="credits-list">
                    <li>Three.js</li>
                    <li>Cannon-es</li>
                    <li>Vite</li>
                    <li>TypeScript</li>
                    <li>Electron</li>
                    <li>Vitest</li>
                </ul>
            </div>
        </div>
    </div>
</div>
